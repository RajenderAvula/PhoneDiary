name: Generate Keystore & Base64

on:
  workflow_dispatch:

jobs:
  create-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Generate debug.keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Print Keystore SHA-1 Fingerprint
        run: |
          echo "=== YOUR FIXED SHA-1 FINGERPRINT ==="
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep "SHA1:"

      - name: Output Base64 for GitHub Secrets
        run: |
          echo "=== COPY EVERYTHING BELOW THIS LINE ==="
          base64 -w 0 debug.keystore
          echo ""
          echo "=== END OF BASE64 STRING ==="
